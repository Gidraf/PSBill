# ─────────────────────────────────────────────────────────────────────────────
#  Compile-time module selection
#
#  Every module starts ticked (true). Untick (false) the ones you do NOT want
#  compiled into the APK — their code, screens, manifest permissions and
#  libraries are left out of the build entirely. All apps talk to the same
#  CVPAP API; the partner's enabled modules on the server still decide what a
#  signed-in user actually sees among the ones compiled in.
#
#  Interactive picker :  python3 tools/select_modules.py
#  One-off / CI       :  ./gradlew :ajiriwa:assembleRelease -Pajiriwa.modules=dashboard,sms,properties
# ─────────────────────────────────────────────────────────────────────────────

# ── Ajiriwa (business / field-agent app) ─────────────────────────────────────
# Business analytics home screen
ajiriwa.dashboard=true
# Orders, create order, delivery GPS tracking
ajiriwa.orders=true
# SMS Engine: phone SIM gateway, inbox, outbox, M-Pesa SMS capture
ajiriwa.sms=true
# WiFi billing (hotspot packages, sessions, vouchers)
ajiriwa.wifi=true
# ESC/POS + office printer setup
ajiriwa.printing=true
# Gaming arcade / Playgate screens, sessions, queue, loser-pay
ajiriwa.arcade=true
# Customer list
ajiriwa.customers=true
# Product catalogue
ajiriwa.catalogue=true
# Properties & houses: listings, specs, photos, map + directions, approvals, sharing
ajiriwa.properties=true
# Marketing: SMS campaigns to customers
ajiriwa.marketing=true

# ── PSBill (gaming lounge customer / attendant app) ──────────────────────────
# (Sessions — pairing and station control — is the core and always compiled.)
# Matches / game line-up
psbill.matches=true
# WiFi vouchers
psbill.wifi=true
# Screens configuration, queue and session history
psbill.screens=true
# Reports & telemetry
psbill.reports=true
